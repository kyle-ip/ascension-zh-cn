name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Build inventory ledger
        run: python tools/inventory_build.py
      - name: Pytest regression gates
        run: python -m pytest -q

  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows installer
        shell: pwsh
        run: ./scripts/publish-installer.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscensionZhCn-Setup-win-x64
          path: dist/AscensionZhCn-Setup-win-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $args = @(
            "release", "create", $tag,
            "dist/AscensionZhCn-Setup-win-x64.zip",
            "--title", $tag,
            "--generate-notes"
          )
          if ($tag -match "test|alpha|beta|rc|preview") {
            $args += "--prerelease"
          }
          gh @args
